<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artisan — class diagram editor</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>
    (function () {
      var t = localStorage.getItem("wise-uml-theme");
      if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
      var p = localStorage.getItem("wise-uml-palette");
      if (p === "developer" || p === "artisan" || p === "navy") {
        document.documentElement.setAttribute("data-theme", p);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header id="toolbar">
    <div class="brand">Artisan</div>

    <div class="tb-group">
      <button id="btn-add-node" class="btn" title="Add a node (also: double-click canvas or right-click canvas)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
        Node
      </button>

      <button id="btn-tidy" class="btn" title="Re-run automatic layout (dagre)">Tidy</button>
      <select id="sel-lines" class="btn" title="Edge routing style">
        <option value="straight">Lines: straight</option>
        <option value="ortho">Lines: rectangular</option>
        <option value="smooth">Lines: smooth</option>
        <option value="elliptic">Lines: curves</option>
      </select>
      <button id="btn-colorize" class="btn toggle" title="Paint relations orange">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 12.5C4 7 7 4.5 14 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        Color links
      </button>

      <button id="btn-notes" class="btn" title="Project notes">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 11.5 11 3.5l1.5 1.5-8 8H3v-1.5zM10 2l1.5-1.5L15 3.5 13.5 5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Notes
      </button>

      <button id="btn-connect" class="btn" title="Connect .artisan/diagram.json so edits autosave to disk (Chrome/Edge)" style="display:none">Connect file</button>

      <button id="btn-ack" class="btn ack" title="Mark AI-made diagram changes as seen" style="display:none"></button>
    </div>

    <div class="tb-spacer"></div>

    <div class="tb-group">
      <button id="btn-undo" class="btn icon" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M6 3 2.5 6.5 6 10M3 6.5h6.5a4 4 0 0 1 0 8H6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-redo" class="btn icon" title="Redo (Ctrl+Shift+Z)">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M10 3l3.5 3.5L10 10M13 6.5H6.5a4 4 0 0 0 0 8H10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-import" class="btn" title="Import diagram JSON">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 10V2M5 5l3-3 3 3M3 13h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Import
      </button>
      <button id="btn-export" class="btn" title="Export / Import">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
      <select id="sel-palette" class="btn" title="Color palette">
        <option value="default">Theme: Default</option>
        <option value="developer">Theme: Developer</option>
        <option value="artisan">Theme: Artisan</option>
        <option value="navy">Theme: Navy</option>
      </select>
      <button id="btn-theme" class="btn icon" title="Toggle light / dark theme">
        <svg id="icon-theme" viewBox="0 0 16 16" width="15" height="15"></svg>
      </button>
      <button id="btn-clear" class="btn icon danger" title="Clear diagram">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <a class="btn" href="https://editor.artisan-uml.dev/docs/" target="_blank" rel="noopener" title="Documentation">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1.5 4c0-1.1.9-2 2-2h4v12h-4a2 2 0 0 1-2-2V4zm13 0a2 2 0 0 0-2-2h-4v12h4a2 2 0 0 0 2-2V4z" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
        Docs
      </a>
      <a class="btn" href="https://github.com/oscardelgado02/artisan-uml" target="_blank" rel="noopener" title="GitHub repository">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <a class="btn" href="https://oscardelgado.dev" target="_blank" rel="noopener" title="Author — oscardelgado.dev">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M1.8 8h12.4M8 1.8c2 1.7 2 10.7 0 12.4M8 1.8c-2 1.7-2 10.7 0 12.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        oscardelgado.dev
      </a>
    </div>
  </header>

  <main id="canvas-wrap">
    <div id="viewport">
      <svg id="edges">
        <defs>
          <marker id="m-arrow" viewBox="0 0 12 14" markerWidth="12" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,1 L11,7 L1,13" class="mk-stroke" />
          </marker>
          <marker id="m-triangle" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,1 L13,7 L1,13 Z" class="mk-bg" />
          </marker>
          <marker id="m-diamond-hollow" viewBox="0 0 16 10" markerWidth="16" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,5 L8,1 L15,5 L8,9 Z" class="mk-bg" />
          </marker>
          <marker id="m-diamond-filled" viewBox="0 0 16 10" markerWidth="16" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M1,5 L8,1 L15,5 L8,9 Z" class="mk-fill" />
          </marker>
        </defs>
        <g id="edge-paths"></g>
        <g id="link-ghost"></g>
      </svg>
      <div id="nodes"></div>
    </div>
  </main>

  <div id="zoom-widget">
    <button id="zoom-out" title="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-fit" title="Fit view">⤢</button>
  </div>

  <div id="save-warn" hidden>
    <div class="warn-title"><span>Heads up</span></div>
    This file is mainly for <strong>viewing</strong> the diagram — edits may not save. For the best experience run
    <code>artisan serve</code> and open <code>http://localhost:4173</code> (edits autosave to diagram.json).
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <input type="file" id="file-import" accept=".json" hidden />

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
