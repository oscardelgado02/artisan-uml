      @font-face {
        font-family: 'Lora';
        font-style: normal;
        font-weight: 600;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
